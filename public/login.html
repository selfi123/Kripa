<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Sign In – KRIPA Pickles</title>
    <link rel="stylesheet" href="/css/styles.css?v=3.5" />
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .login-card {
            width: 100%; max-width: 420px; background: var(--surface);
            border: 1.5px solid var(--border-kasavu); border-radius: 24px;
            padding: 44px 36px; box-shadow: var(--shadow-lg); text-align: center;
        }
        .brand-logo { font-family: var(--font-heading); font-size: 36px; font-weight: 700; color: var(--leaf-deep); letter-spacing: 3px; display: block; }
        .brand-tag { font-size: 11.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--kasavu); display: block; margin-bottom: 24px; }
        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
            padding: 14px 20px; background: #fff; border: 1.5px solid var(--border);
            border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text);
            box-shadow: var(--shadow-sm); transition: var(--transition-fast);
        }
        .google-btn:hover { border-color: var(--leaf); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .google-logo { width: 20px; height: 20px; }
        .error-banner { background: var(--spice-soft); color: var(--spice); border: 1px solid rgba(185,56,34,0.25); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; }
        .user-card { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 20px; text-align: left; }
        .user-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
        .user-info-name { font-weight: 700; font-size: 15px; color: var(--leaf-deep); }
        .user-info-email { font-size: 12px; color: var(--text-muted); }
        .back-link { margin-top: 20px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .back-link span { color: var(--leaf); }
        @media(max-width:520px) {
            body { padding: 72px 16px 32px; }
            .login-card { padding: 32px 20px; border-radius: 18px; }
        }
    </style>
</head>

<body>
    <button type="button" class="lang-toggle-btn" onclick="toggleLanguage()" style="position:fixed;top:20px;right:20px;z-index:100;" aria-label="Switch language"><span class="lang-active">ML</span> <span class="lang-sep">|</span> <span>EN</span></button>
    <div class="login-card">
        <span class="brand-logo">KRIPA <span style="font-size:16px;color:var(--kasavu);">കൃപ</span></span>
        <span class="brand-tag" data-i18n="login_tag">Authentic Taste of Kerala</span>

        <div class="error-banner" id="error-banner" style="display:none;"></div>

        <div id="logged-in-state" style="display:none;">
            <div class="user-card">
                <img class="user-avatar" id="user-avatar" src="" alt="Profile" />
                <div>
                    <div class="user-info-name" id="user-name"></div>
                    <div class="user-info-email" id="user-email"></div>
                </div>
            </div>
            <a href="/" class="btn btn-gold" style="width:100%;margin-bottom:10px;" data-i18n="login_cont">✦ Continue Shopping</a>
            <button class="btn btn-outline" style="width:100%;" onclick="window.location.href='/auth/logout'" data-i18n="nav_signout">Sign out</button>
        </div>

        <div id="signed-out-state">
            <p style="color:var(--text-muted);font-size:13.5px;line-height:1.7;margin-bottom:24px;" data-i18n="login_desc">
                Sign in with Google to track your pickle orders, reserve upcoming batches, and checkout faster.
            </p>
            <a id="google-signin-btn" href="/auth/google?redirect=home" class="google-btn">
                <svg class="google-logo" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                <span data-i18n="login_google">Continue with Google</span>
            </a>
        </div>
    </div>

    <a href="/" class="back-link" data-i18n="nav_back_store">← Back to Store</a>

    <script src="/js/i18n.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            const b = document.getElementById('error-banner');
            b.style.display = 'block';
            b.textContent = 'Authentication failed. Please try again.';
        }
        const redirectTarget = params.get('redirect') || 'home';
        document.getElementById('google-signin-btn').href = `/auth/google?redirect=${encodeURIComponent(redirectTarget)}`;

        fetch('/auth/me').then(r => r.json()).then(({ user }) => {
            if (user) {
                document.getElementById('signed-out-state').style.display = 'none';
                document.getElementById('logged-in-state').style.display = 'block';
                document.getElementById('user-name').textContent = user.name || 'Customer';
                document.getElementById('user-email').textContent = user.email || '';
                document.getElementById('user-avatar').src = user.avatar || '';
            }
        }).catch(() => {});
    </script>
</body>

</html>
