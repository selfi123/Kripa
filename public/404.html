<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Page Not Found – KRIPA Pickles</title>
    <link rel="stylesheet" href="/css/styles.css?v=3.3" />
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
        .num { font-family: var(--font-heading); font-size: clamp(90px, 18vw, 160px); line-height: 1; color: var(--kasavu); opacity: 0.45; }
        h1 { font-family: var(--font-heading); font-size: clamp(24px, 4vw, 38px); color: var(--leaf-deep); margin: 12px 0; }
        p { color: var(--text-muted); font-size: 15px; max-width: 400px; margin-bottom: 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>

<body>
    <button type="button" class="lang-toggle-btn" onclick="toggleLanguage()" style="position:fixed;top:20px;right:20px;z-index:100;" aria-label="Switch language"><span class="lang-active">ML</span> <span class="lang-sep">|</span> <span>EN</span></button>
    <div class="num">404</div>
    <h1 data-i18n="err404_title">Page Not Found</h1>
    <p data-i18n="err404_desc">The page you're looking for doesn't exist. Let's bring you back to our fresh Kerala pickles.</p>
    <div class="actions">
        <a href="/" class="btn btn-gold" data-i18n="btn_back_home">Back to Home</a>
        <a href="/#categories" class="btn btn-outline" data-i18n="nav_shop">Shop Pickles</a>
    </div>
    <script src="/js/i18n.js"></script>
</body>

</html>
