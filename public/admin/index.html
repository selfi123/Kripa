<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRIPA Admin – Sign In</title>
    <link rel="stylesheet" href="/css/styles.css?v=4.1" />
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .login-card {
            width: 100%; max-width: 400px; background: var(--surface);
            border: 1.5px solid var(--border-kasavu); border-radius: 24px;
            padding: 44px 36px; box-shadow: var(--shadow-lg); text-align: center;
        }
        .login-logo { font-family: var(--font-heading); font-size: 36px; font-weight: 700; color: var(--leaf-deep); letter-spacing: 3px; display: block; }
        .login-sub { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--kasavu); display: block; margin-bottom: 28px; }
        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
            padding: 14px 20px; background: #fff; border: 1.5px solid var(--border);
            border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text);
            box-shadow: var(--shadow-sm); transition: var(--transition-fast);
        }
        .google-btn:hover { border-color: var(--leaf); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .google-logo { width: 20px; height: 20px; }
        .error-banner { background: var(--spice-soft); color: var(--spice); border: 1px solid rgba(185,56,34,0.25); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; }
        .back-link { margin-top: 24px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .back-link a { color: var(--leaf); }
    </style>
</head>

<body>
    <div class="login-card">
        <span class="login-logo">KRIPA <span style="font-size:16px;color:var(--kasavu);">കൃപ</span></span>
        <span class="login-sub">Kitchen Admin Portal</span>

        <div class="error-banner" id="error-banner" style="display:none;"></div>

        <a href="/auth/google?redirect=admin" class="google-btn">
            <svg class="google-logo" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
            </svg>
            Sign in with Google
        </a>

        <p class="back-link">← <a href="/">Back to Store</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'not_admin') {
            const b = document.getElementById('error-banner');
            b.style.display = 'block';
            b.textContent = 'Your Google account is not authorized as admin. Check ADMIN_EMAILS in your environment variables.';
        } else if (params.get('error') === 'auth_failed') {
            const b = document.getElementById('error-banner');
            b.style.display = 'block';
            b.textContent = 'Google sign-in failed or the login link expired. Please click Sign in with Google again.';
        }
        if (params.get('auth') === 'google') {
            fetch('/auth/admin-token').then(r => r.json()).then(({ token }) => {
                if (token) {
                    sessionStorage.setItem('kripa_admin_token', token);
                    window.location.replace('/admin/dashboard.html');
                }
            }).catch(() => { });
        }
        if (sessionStorage.getItem('kripa_admin_token')) {
            window.location.href = '/admin/dashboard.html';
        }
    </script>
</body>

</html>
