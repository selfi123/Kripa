<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Orders – KRIPA Pickles</title>
    <link rel="stylesheet" href="/css/styles.css?v=3.9" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
    <style>
        .orders-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .orders-wrap h1 {
            font-family: var(--font-heading);
            font-size: clamp(28px, 4vw, 40px);
            color: var(--leaf-deep);
            margin-bottom: 6px;
        }

        .page-sub {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--kasavu);
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .order-card {
            background: var(--surface);
            border: 1px solid var(--border-kasavu);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .order-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .order-id {
            font-size: 13px;
            letter-spacing: 1.2px;
            color: var(--leaf);
            font-weight: 700;
            font-family: monospace;
        }

        .order-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-paid,
        .status-delivered {
            background: var(--leaf-soft);
            color: var(--leaf);
            border: 1px solid rgba(31, 81, 53, 0.2);
        }

        .status-pending {
            background: #FEF4E4;
            color: #B4690E;
            border: 1px solid rgba(217, 138, 28, 0.25);
        }

        .status-processing,
        .status-shipped {
            background: #EBF3FA;
            color: #1E6091;
            border: 1px solid rgba(30, 96, 145, 0.2);
        }

        .status-cancelled,
        .status-failed {
            background: var(--spice-soft);
            color: var(--spice);
            border: 1px solid rgba(185, 56, 34, 0.2);
        }

        .order-thumb {
            width: 54px;
            height: 54px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: var(--bg-alt);
        }

        .order-footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .order-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--leaf-deep);
        }

        .order-total small {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .order-addr {
            font-size: 12.5px;
            color: var(--text-muted);
            text-align: right;
            line-height: 1.6;
        }

        .no-orders {
            text-align: center;
            padding: 64px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .no-orders h3 {
            font-family: var(--font-heading);
            font-size: 26px;
            color: var(--leaf-deep);
            margin: 12px 0 8px;
        }

        @media(max-width:600px) {
            .orders-wrap {
                padding: 22px 14px 56px;
            }

            .order-card {
                padding: 18px 16px;
                border-radius: 14px;
            }

            .order-addr {
                text-align: left;
            }

            .no-orders {
                padding: 44px 18px;
            }
        }
    </style>
</head>

<body>
    <nav id="navbar" class="scrolled">
        <div class="nav-inner">
            <a href="/" class="nav-logo"><span>KRIPA</span><span class="nav-logo-ml">കൃപ</span></a>
            <ul class="nav-links">
                <li><a href="/" data-i18n="nav_home">Home</a></li>
                <li><a href="/#categories" data-i18n="nav_shop">Our Pickles</a></li>
            </ul>
            <div class="nav-actions">
                <button type="button" class="lang-toggle-btn" onclick="toggleLanguage()"
                    aria-label="Switch language"><span class="lang-active">ML</span> <span class="lang-sep">|</span>
                    <span>EN</span></button>
                <div id="nav-user-slot" style="display:flex;align-items:center;"></div>
                <button class="nav-icon-btn" id="cart-btn" aria-label="Cart">
                    <i data-lucide="shopping-bag" style="width:18px;height:18px;"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
            </div>
        </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/" onclick="closeMobileMenu()" data-i18n="nav_home">Home</a>
        <a href="/#categories" onclick="closeMobileMenu()" data-i18n="nav_shop">Our Pickles</a>
        <div id="mobile-user-slot"
            style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:16px;"></div>
    </div>

    <div class="orders-wrap">
        <p class="page-sub" data-i18n="orders_sub">Account</p>
        <h1 data-i18n="orders_title">My Orders</h1>
        <div id="orders-container">
            <div class="skeleton" style="height:160px;margin-bottom:16px;"></div>
            <div class="skeleton" style="height:160px;"></div>
        </div>
    </div>

    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3 data-i18n="cart_title">YOUR BASKET</h3><button class="cart-close" id="cart-close"><i data-lucide="x"
                    style="width:20px;height:20px;"></i></button>
        </div>
        <div class="cart-items" id="cart-items-list"></div>
        <div class="cart-footer" id="cart-footer" style="display:none;"></div>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>
    <script>
        let _cachedOrders = null;
        let _ordersAuthRequired = false;

        function getOrderStatusLabel(status) {
            if (typeof t !== 'function') return status;
            const keyMap = {
                processing: 'step_processing',
                shipped: 'step_shipped',
                delivered: 'step_delivered',
                cancelled: 'step_cancelled'
            };
            return keyMap[status] ? t(keyMap[status]) : status;
        }

        function renderOrdersView() {
            const container = document.getElementById('orders-container');
            if (!container) return;
            if (_ordersAuthRequired) {
                container.innerHTML = `<div class="no-orders">
                    <div style="width:48px;height:48px;margin:0 auto 14px;border-radius:12px;background:var(--kasavu-soft);display:flex;align-items:center;justify-content:center;color:var(--monsoon);"><i data-lucide="lock" style="width:24px;height:24px;"></i></div>
                    <h3>${t('orders_signin_title')}</h3>
                    <p style="color:var(--text-muted);margin-bottom:24px;">${t('orders_signin_desc')}</p>
                    <a href="/login" class="btn btn-gold">${t('nav_signin')}</a>
                </div>`;
                if (window.lucide) lucide.createIcons();
                return;
            }
            if (!_cachedOrders) return;
            if (!_cachedOrders.length) {
                container.innerHTML = `<div class="no-orders">
                    <div style="width:48px;height:48px;margin:0 auto 14px;border-radius:12px;background:var(--kasavu-soft);display:flex;align-items:center;justify-content:center;color:var(--monsoon);"><i data-lucide="package" style="width:24px;height:24px;"></i></div>
                    <h3>${t('orders_none_title')}</h3>
                    <p style="color:var(--text-muted);margin-bottom:24px;">${t('orders_none_desc')}</p>
                    <a href="/" class="btn btn-gold">${t('orders_shop_now')}</a>
                </div>`;
                if (window.lucide) lucide.createIcons();
                return;
            }
            const loc = (typeof getLang === 'function' && getLang() === 'ml') ? 'ml-IN' : 'en-IN';
            container.innerHTML = _cachedOrders.map(order => {
                const items = order.items || [];
                const addr = order.address || {};
                const statusClass = {
                    paid: 'status-paid', pending: 'status-pending', failed: 'status-failed',
                    delivered: 'status-delivered', shipped: 'status-shipped',
                    processing: 'status-processing', cancelled: 'status-cancelled'
                }[order.status] || 'status-pending';
                const canCancel = ['pending', 'paid', 'processing'].includes(order.status);

                return `<div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">#${order.id.slice(0, 8).toUpperCase()}</div>
                            <div class="order-date">${new Date(order.created_at).toLocaleDateString(loc, { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                        <span class="status-badge ${statusClass}">${getOrderStatusLabel(order.status)}</span>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        ${items.map(i => `
                            <div style="display:flex;gap:12px;align-items:center;">
                                <img class="order-thumb" src="${i.thumb || ''}" alt="${i.name}" onerror="this.style.display='none'" />
                                <div>
                                    <div style="font-size:14px;color:var(--leaf-deep);font-weight:600;">${i.name}</div>
                                    ${i.selectedSize ? `<div style="font-size:11px;color:var(--kasavu);font-weight:700;text-transform:uppercase;">${t('cart_weight')}: ${i.selectedSize}</div>` : ''}
                                    <div style="font-size:12px;color:var(--text-muted);">Qty: ${i.qty || 1} × ₹${parseFloat(i.price).toLocaleString('en-IN')}</div>
                                </div>
                            </div>`).join('')}
                    </div>
                    <div class="order-footer">
                        <div>
                            <div class="order-total"><small>${t('orders_total_paid')}</small>₹${parseFloat(order.total).toLocaleString('en-IN')}</div>
                            <div style="display:flex;gap:8px;margin-top:12px;">
                                <a href="/order.html?id=${order.id}" class="btn btn-gold" style="padding:8px 16px;font-size:12px;">${t('orders_track_btn')}</a>
                                ${canCancel ? `<button class="btn btn-outline" style="padding:8px 16px;font-size:12px;border-color:rgba(185,56,34,0.4);color:var(--spice);" onclick="cancelOrder('${order.id}')">${t('orders_cancel_btn')}</button>` : ''}
                            </div>
                        </div>
                        <div class="order-addr">${escapeHtml(addr.name || '')}<br/>${escapeHtml(addr.city || '')}, ${escapeHtml(addr.state || '')} ${escapeHtml(addr.pincode || '')}</div>
                    </div>
                </div>`;
            }).join('');
            if (window.lucide) lucide.createIcons();
        }

        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order? This action cannot be undone.')) return;
            try {
                const res = await fetch(`/api/orders/${orderId}/cancel`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to cancel order');
                showToast('Order successfully cancelled');
                setTimeout(() => window.location.reload(), 1200);
            } catch (err) { showToast(err.message); }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) lucide.createIcons();
            const container = document.getElementById('orders-container');
            try {
                const res = await fetch('/api/orders/my');
                if (res.status === 401) {
                    _ordersAuthRequired = true;
                    renderOrdersView();
                    return;
                }
                _cachedOrders = await res.json();
                renderOrdersView();
            } catch (e) {
                container.innerHTML = `<div class="no-orders"><p>Could not load orders. Please try again.</p></div>`;
            }
            window.addEventListener('kripa:langchange', renderOrdersView);
        });
    </script>
</body>

</html>
