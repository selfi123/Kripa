<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Order Confirmed – KRIPA Pickles</title>
    <link rel="stylesheet" href="/css/styles.css?v=3.7" />
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
        .success-card {
            background: var(--surface); border: 1.5px solid var(--border-kasavu);
            border-radius: 24px; padding: 48px 36px; max-width: 480px; width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .check-circle { width: 84px; height: 84px; margin: 0 auto 24px; }
        .check-circle svg { width: 84px; height: 84px; }
        .circle-bg { fill: var(--leaf-soft); stroke: rgba(31,81,53,0.2); stroke-width: 3; }
        .circle-progress { fill: none; stroke: var(--leaf); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; animation: drawCircle 0.7s ease 0.1s forwards; }
        .check-mark { fill: none; stroke: var(--leaf); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawCheck 0.4s ease 0.75s forwards; }
        @keyframes drawCircle { to { stroke-dashoffset: 0; } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }
        h1 { font-family: var(--font-heading); font-size: clamp(30px, 5vw, 42px); color: var(--leaf-deep); margin-bottom: 10px; }
        .sub { font-size: 14.5px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.7; }
        .order-id-badge {
            display: inline-block; background: var(--kasavu-soft); border: 1px solid var(--border-kasavu);
            border-radius: 12px; padding: 12px 24px; font-weight: 700; font-family: monospace; font-size: 15px; color: var(--leaf-deep); margin-bottom: 28px;
        }
        .order-id-badge span:first-child { display: block; font-family: var(--font-body); font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        @media(max-width:520px) {
            body { padding: 72px 16px 32px; }
            .success-card { padding: 34px 20px; border-radius: 18px; }
            .actions .btn { width: 100%; }
        }
    </style>
</head>

<body>
    <button type="button" class="lang-toggle-btn" onclick="toggleLanguage()" style="position:fixed;top:20px;right:20px;z-index:100;" aria-label="Switch language"><span class="lang-active">ML</span> <span class="lang-sep">|</span> <span>EN</span></button>
    <div class="success-card">
        <div class="check-circle">
            <svg viewBox="0 0 90 90">
                <circle class="circle-bg" cx="45" cy="45" r="42" />
                <circle class="circle-progress" cx="45" cy="45" r="42" transform="rotate(-90 45 45)" />
                <polyline class="check-mark" points="28,46 40,58 63,34" />
            </svg>
        </div>
        <h1 data-i18n="succ_title">Order Confirmed!</h1>
        <p class="sub" data-i18n-html="succ_sub">Thank you for choosing KRIPA Pickles.<br />Your jars are being packed fresh with care in our Kerala kitchen.</p>
        <div class="order-id-badge">
            <span data-i18n="succ_ref">Order Reference</span>
            <span id="order-id-text">—</span>
        </div>
        <div class="actions">
            <a href="/" class="btn btn-gold" data-i18n="succ_cont">Continue Shopping</a>
            <a href="/orders" class="btn btn-outline" data-i18n="succ_view">View My Orders</a>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        if (id) document.getElementById('order-id-text').textContent = '#' + id.slice(0, 8).toUpperCase();
    </script>
</body>

</html>
