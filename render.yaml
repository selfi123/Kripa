services:
  - type: web
    name: kripa-pickles
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kripa-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false   # Fill in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false   # Fill in Render dashboard
      - key: ADMIN_EMAILS
        sync: false   # Your Gmail address(es), comma-separated
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: kripa2024
      - key: APP_URL
        sync: false   # Your Render app URL e.g. https://kripapickles.onrender.com

databases:
  - name: kripa-db
    plan: free
    databaseName: kripa
